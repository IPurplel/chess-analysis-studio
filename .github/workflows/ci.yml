name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Shell scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the real Dockerfile (downloads Stockfish and verifies its checksum) and, on main, publishes
  # ghcr.io/<owner>/<repo>:latest so a small server can `docker pull` instead of building.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test the freshly built image: it must start and answer its health check.
      - name: Smoke test image
        run: |
          docker build -t studio-smoke .
          docker run -d --name studio-smoke-run -p 3000:3000 -e NO_ENGINE=1 studio-smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          docker logs studio-smoke-run; exit 1
